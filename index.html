<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Epix Jump</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#070b18;font-family:"Segoe UI",Tahoma,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;touch-action:none}
#gameWrap{width:min(1100px,100vw);height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#hud{width:min(96vw,1000px);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border:1px solid #ffffff22;border-radius:16px;background:#080c20bb;backdrop-filter:blur(10px);font-weight:800;font-size:16px;z-index:5}
.hudItem{display:flex;gap:7px;align-items:center;white-space:nowrap}.value{color:#67e8f9}.ready{color:#4ade80}.cool{color:#fb7185}
#gameCanvas{width:min(96vw,1000px);height:auto;aspect-ratio:16/9;border-radius:18px;border:1px solid #ffffff20;box-shadow:0 20px 60px #0009;display:block}
#controls{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none;z-index:10}
.pad{display:flex;gap:10px;pointer-events:auto}
.control{width:64px;height:64px;border-radius:20px;border:1px solid #ffffff30;background:linear-gradient(145deg,#24345f,#111a38);color:#fff;box-shadow:0 8px 20px #0008,inset 0 1px #ffffff25;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.control:active,.pressed{transform:scale(.94);background:#31518c}#dashBtn{width:76px;height:76px;border-radius:50%;font-size:14px;color:#67e8f9}#jumpBtn{width:72px;height:72px;border-radius:50%}
#hint{position:fixed;top:78px;left:50%;transform:translateX(-50%);color:#cbd5e1;background:#0006;padding:6px 12px;border-radius:20px;font-size:12px;z-index:4}
@media(max-width:600px){#gameWrap{justify-content:flex-start;padding-top:8px;gap:5px}#hud{font-size:12px;padding:8px 9px;border-radius:12px}#gameCanvas{width:96vw;border-radius:14px}#hint{top:82px;font-size:10px}.control{width:58px;height:58px;border-radius:18px}#dashBtn{width:68px;height:68px}#jumpBtn{width:66px;height:66px}}
</style>
</head>
<body>
<div id="gameWrap">
<div id="hud">
<div class="hudItem">🏆 النقاط <span id="scoreVal" class="value">0</span></div>
<div class="hudItem">❤️ الأرواح <span id="livesVal" class="value">3</span></div>
<div class="hudItem">⚡ Dash <span id="dashVal" class="ready">جاهز</span></div>
</div>
<canvas id="gameCanvas" width="1000" height="562"></canvas>
</div>
<div id="hint">الكمبيوتر: الأسهم / A,D — القفز: Space — الاندفاع: Shift</div>
<div id="controls">
<div class="pad"><button class="control" id="leftBtn">◀</button><button class="control" id="rightBtn">▶</button></div>
<div class="pad"><button class="control" id="jumpBtn">⬆</button><button class="control" id="dashBtn">DASH</button></div>
</div>
<script>
const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d"),W=1000,H=562;
const scoreVal=document.getElementById("scoreVal"),livesVal=document.getElementById("livesVal"),dashVal=document.getElementById("dashVal");
const keys={};let score=0,lives=3,cameraX=0,shake=0,time=0;
const AC=window.AudioContext||window.webkitAudioContext,audioCtx=AC?new AC():null;
function sound(t){if(!audioCtx)return;if(audioCtx.state==="suspended")audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime,c={jump:[220,520,.12,"sine"],coin:[550,900,.16,"triangle"],dash:[300,90,.2,"sawtooth"],hit:[110,45,.25,"square"]}[t];if(!c)return;o.type=c[3];o.frequency.setValueAtTime(c[0],n);o.frequency.exponentialRampToValueAtTime(c[1],n+c[2]);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.01,n+c[2]);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+c[2])}
const player={x:100,y:390,w:34,h:50,vx:0,vy:0,speed:5.3,jump:-12,gravity:.55,grounded:false,dashCD:0,dashing:false,dashT:0,dashDir:1,inv:0};
const platforms=[{x:0,y:460,w:1400,h:102},{x:390,y:350,w:190,h:22},{x:690,y:265,w:210,h:22},{x:1000,y:350,w:170,h:22},{x:1290,y:285,w:240,h:22},{x:1700,y:460,w:1700,h:102},{x:1940,y:350,w:170,h:22},{x:2250,y:250,w:190,h:22},{x:2570,y:330,w:220,h:22},{x:2920,y:245,w:220,h:22}];
let coins=[450,780,1060,1380,2000,2340,2660,3010].map((x,i)=>({x,y:[300,215,300,235,300,200,280,195][i],r:12,taken:false}));
const enemyStart=()=>[{x:500,y:410,w:36,h:50,vx:1.8,min:400,max:560},{x:1080,y:300,w:36,h:50,vx:-1.8,min:1000,max:1130},{x:1840,y:410,w:36,h:50,vx:2.5,min:1750,max:2010},{x:2600,y:280,w:36,h:50,vx:1.8,min:2570,max:2750}];let enemies=enemyStart(),particles=[];
function burst(x,y,c,n=14){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,r:2+Math.random()*4,life:25+Math.random()*20,c})}
function resetPlayer(){player.x=100;player.y=390;player.vx=0;player.vy=0;player.dashing=false;player.inv=45}
function over(){alert("انتهت اللعبة! حاول مرة أخرى.");score=0;lives=3;coins.forEach(c=>c.taken=false);enemies=enemyStart();resetPlayer()}
function jump(){if(player.grounded&&!player.dashing){player.vy=player.jump;player.grounded=false;sound("jump");burst(player.x+17,player.y+48,"#bff6ff",8)}}
function dash(){if(player.dashCD<=0&&!player.dashing){player.dashing=true;player.dashT=13;player.dashCD=65;player.dashDir=(keys.ArrowLeft||keys.KeyA)?-1:((keys.ArrowRight||keys.KeyD)?1:player.dashDir);sound("dash");shake=8}}
window.addEventListener("keydown",e=>{keys[e.code]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")jump();if(e.code==="ShiftLeft"||e.code==="ShiftRight")dash()});
window.addEventListener("keyup",e=>keys[e.code]=false);
function bind(id,key,action){const b=document.getElementById(id),down=e=>{e.preventDefault();b.classList.add("pressed");action?action():keys[key]=true},up=e=>{e.preventDefault();b.classList.remove("pressed");if(!action)keys[key]=false};["touchstart","mousedown"].forEach(v=>b.addEventListener(v,down,{passive:false}));["touchend","touchcancel","mouseup","mouseleave"].forEach(v=>b.addEventListener(v,up,{passive:false}))}
bind("leftBtn","ArrowLeft");bind("rightBtn","ArrowRight");bind("jumpBtn",null,jump);bind("dashBtn",null,dash);
function update(){
 time++;if(player.dashCD>0)player.dashCD--;if(player.inv>0)player.inv--;
 if(player.dashing){player.vx=player.dashDir*16;player.vy=0;player.dashT--;if(player.dashT<=0)player.dashing=false}
 else{if(keys.ArrowRight||keys.KeyD){player.vx=player.speed;player.dashDir=1}else if(keys.ArrowLeft||keys.KeyA){player.vx=-player.speed;player.dashDir=-1}else player.vx*=.72;player.vy+=player.gravity}
 const oldY=player.y;player.x+=player.vx;player.y+=player.vy;player.grounded=false;
 platforms.forEach(p=>{if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.grounded=true}});
 player.x=Math.max(-20,player.x);enemies.forEach(e=>{e.x+=e.vx;if(e.x<e.min||e.x>e.max)e.vx*=-1});
 enemies.slice().forEach(e=>{if(player.x+player.w>e.x&&player.x<e.x+e.w&&player.y+player.h>e.y&&player.y<e.y+e.h&&player.inv<=0){if(player.dashing){enemies=enemies.filter(a=>a!==e);score+=100;sound("coin");burst(e.x+18,e.y+25,"#67e8f9",18)}else if(player.vy>0&&oldY+player.h<=e.y+12){enemies=enemies.filter(a=>a!==e);player.vy=-9;score+=50;sound("coin");burst(e.x+18,e.y+20,"#fb7185",18)}else{lives--;sound("hit");shake=14;resetPlayer();if(lives<=0)over()}}});
 coins.forEach(c=>{if(!c.taken&&player.x+player.w>c.x-c.r&&player.x<c.x+c.r&&player.y+player.h>c.y-c.r&&player.y<c.y+c.r){c.taken=true;score+=20;sound("coin");burst(c.x,c.y,"#facc15",16)}})
 if(player.y>H+100){lives--;sound("hit");shake=14;resetPlayer();if(lives<=0)over()}
 cameraX=Math.max(0,Math.min(2600,player.x-320));particles.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;if(p.life<=0)particles.splice(i,1)});
 scoreVal.textContent=score;livesVal.textContent=lives;dashVal.textContent=player.dashCD<=0?"جاهز":Math.ceil(player.dashCD/10);dashVal.className=player.dashCD<=0?"ready":"cool"
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawPlayer(){
 const x=player.x,y=player.y;ctx.save();if(player.inv%6<3)ctx.globalAlpha=.55;
 ctx.fillStyle="#0006";ctx.beginPath();ctx.ellipse(x+17,y+51,20,5,0,0,Math.PI*2);ctx.fill();
 if(player.dashing){for(let i=1;i<5;i++){ctx.globalAlpha=.12;ctx.fillStyle="#67e8f9";rr(x-player.dashDir*i*18,y+6,32,42,10)}ctx.globalAlpha=1}
 ctx.fillStyle="#172554";rr(x+5,y+34,10,17,4);rr(x+20,y+34,10,17,4);
 const g=ctx.createLinearGradient(x,y,x+34,y+50);g.addColorStop(0,"#67e8f9");g.addColorStop(1,"#2563eb");ctx.fillStyle=g;rr(x+3,y+17,28,25,9);
 ctx.fillStyle="#e0f2fe";ctx.fillRect(x+5,y+31,24,4);
 ctx.fillStyle="#ffd7b5";ctx.beginPath();ctx.arc(x+17,y+12,12,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#0f172a";ctx.beginPath();ctx.arc(x+17,y+10,12,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(x+6,y+8,23,6);
 ctx.fillStyle="#111827";rr(x+8,y+9,18,7,3);ctx.fillStyle="#67e8f9";ctx.fillRect(x+11,y+11,12,2);
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+17,y+25,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#2563eb";ctx.font="bold 7px Arial";ctx.textAlign="center";ctx.fillText("E",x+17,y+28);ctx.restore()
}
function draw(){
 ctx.save();if(shake){ctx.translate((Math.random()-.5)*7,(Math.random()-.5)*7);shake--}
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#080d2c");sky.addColorStop(.55,"#17245c");sky.addColorStop(1,"#312e81");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(let i=0;i<45;i++){let sx=((i*137-cameraX*.15)%(W+100)+W+100)%(W+100)-50,sy=(i*83)%330;ctx.fillStyle=i%4===0?"#fff":"#ffffff80";ctx.fillRect(sx,sy,2,2)}
 for(let i=0;i<18;i++){let bx=((i*180-cameraX*.25)%(W+180)+W+180)%(W+180)-80,bh=50+(i*37)%120;ctx.fillStyle="#0b1236";ctx.fillRect(bx,H-102-bh,100,bh)}
 ctx.save();ctx.translate(-cameraX,0);
 platforms.forEach(p=>{const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);g.addColorStop(0,p.h>30?"#334155":"#64748b");g.addColorStop(1,"#1e293b");ctx.fillStyle=g;rr(p.x,p.y,p.w,p.h,p.h>30?12:7);ctx.fillStyle="#94a3b8";ctx.fillRect(p.x,p.y,p.w,4)});
 coins.forEach(c=>{if(!c.taken){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(time*.08+c.x)*.18);ctx.fillStyle="#facc15";ctx.beginPath();ctx.ellipse(0,0,c.r*.72,c.r,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fde68a";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#a16207";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText("★",0,4);ctx.restore()}});
 enemies.forEach(e=>{ctx.fillStyle="#7f1d1d";rr(e.x,e.y,e.w,e.h,10);ctx.fillStyle="#ef4444";rr(e.x+4,e.y+5,e.w-8,e.h-9,8);ctx.fillStyle="#fff";ctx.fillRect(e.x+8,e.y+13,6,6);ctx.fillRect(e.x+22,e.y+13,6,6);ctx.fillStyle="#111827";ctx.fillRect(e.x+10,e.y+29,16,4)});
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});drawPlayer();ctx.restore();
 ctx.fillStyle="#ffffff20";rr(20,H-22,W-40,5,3);ctx.fillStyle="#67e8f9";rr(20,H-22,Math.min(W-40,(player.x/3000)*(W-40)),5,3);ctx.restore()
}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
